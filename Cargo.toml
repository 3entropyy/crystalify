[package]
name = "crystalify"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
crossterm = "0.29.0"
futures-util = "0.3.34"
glam = "0.33.11"
librespot = { git = "https://github.com/librespot-org/librespot" }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", features = ["json"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
